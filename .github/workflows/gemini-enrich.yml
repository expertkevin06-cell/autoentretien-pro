name: Gemini database enrichment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - database.json
      - scripts/enrich-db.mjs
      - .github/workflows/gemini-enrich.yml

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enrich database with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-1.5-flash-latest
          ENRICH_MAX: 50
          ENRICH_DELAY_MS: 3000
        run: node scripts/enrich-db.mjs

      - name: Commit generated database
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add database.generated.json

          if ! git diff --staged --quiet; then
            git commit -m "chore: enrich database.generated.json"
            git push
          fi
